name: Verify immutable npm release provenance
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable ordinary release tag
        required: true
        type: string
        default: v0.1.3
permissions:
  contents: read
jobs:
  attest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: write
      artifact-metadata: write
      id-token: write
    strategy:
      matrix:
        package: [ui-primitives, ui-kit, invest-widgets]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
      - name: Verify retained archive and original provenance
        id: subject
        if: ${{ !(startsWith(inputs.tag, 'ui-kit-v') && matrix.package != 'ui-kit') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE: ${{ matrix.package }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^(v|ui-kit-v)[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$RELEASE_TAG" == ui-kit-v* ]]; then
            [[ "$PACKAGE" == ui-kit ]]
            version="${RELEASE_TAG#ui-kit-v}"
          else
            version="${RELEASE_TAG#v}"
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isImmutable,isPrerelease,tagName > release.json
          jq -e --arg tag "$RELEASE_TAG" '.isDraft == false and .isImmutable == true and .isPrerelease == false and .tagName == $tag' release.json
          mkdir release
          archive="global-torque-${PACKAGE}-${version}.tgz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release --pattern "$archive" --pattern "$archive.manifest.json" --pattern "$archive.sha512"
          if [[ "$RELEASE_TAG" == ui-kit-v* ]]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release --pattern selected-release.json
            jq -e --arg pkg "@global-torque/$PACKAGE" --arg version "$version" '.selection == "single-package" and .package == $pkg and .version == $version' release/selected-release.json
          fi
          (cd release && sha512sum --check "$archive.sha512")
          source_commit=$(jq -er '.sourceCommit | select(test("^[a-f0-9]{40}$"))' "release/$archive.manifest.json")
          actual_sha512=$(sha512sum "release/$archive" | cut -d ' ' -f 1)
          sidecar_sha512=$(jq -er '.sha512 | select(test("^[a-f0-9]{128}$"))' "release/$archive.manifest.json")
          sidecar_integrity=$(jq -er '.integrity | select(test("^sha512-[A-Za-z0-9+/]+=*$"))' "release/$archive.manifest.json")
          test "$actual_sha512" = "$sidecar_sha512"
          jq -e --arg pkg "@global-torque/$PACKAGE" --arg version "$version" --arg archive "$archive" --arg source "$source_commit" --arg sha512 "$sidecar_sha512" --arg integrity "$sidecar_integrity" '.schemaVersion == 1 and .sourceDirty == false and .package == $pkg and .version == $version and .artifact == $archive and .sourceCommit == $source and .sha512 == $sha512 and .integrity == $integrity' "release/$archive.manifest.json"
          tar -xOf "release/$archive" package/package.json > package.json
          jq -e --arg pkg "@global-torque/$PACKAGE" --arg version "$version" '.name == $pkg and .version == $version' package.json
          if [[ "$RELEASE_TAG" == ui-kit-v* ]]; then
            jq -e --arg pkg "@global-torque/$PACKAGE" --arg version "$version" --arg archive "$archive" --arg source "$source_commit" --arg sha512 "$sidecar_sha512" --arg integrity "$sidecar_integrity" '(.schemaVersion == 1 and .selection == "single-package" and .package == $pkg and .version == $version and .artifact == $archive and .sourceCommit == $source and .sourceDirty == false and .sha512 == $sha512 and .integrity == $integrity)' release/selected-release.json
          fi
          gh attestation verify "release/$archive" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --signer-digest "$source_commit" --source-digest "$source_commit" \
            --source-ref "refs/tags/$RELEASE_TAG" --deny-self-hosted-runners --format json > original-provenance.json
          test -s original-provenance.json
          jq -e 'type == "array" or type == "object"' original-provenance.json > /dev/null
          printf 'digest=sha512:%s\n' "$actual_sha512" >> "$GITHUB_OUTPUT"
          printf 'name=pkg:npm/%%40global-torque/%s@%s\n' "$PACKAGE" "$version" >> "$GITHUB_OUTPUT"
      - name: Sign exact npm identity
        id: npm
        if: ${{ !(startsWith(inputs.tag, 'ui-kit-v') && matrix.package != 'ui-kit') }}
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.subject.outputs.name }}
          subject-digest: ${{ steps.subject.outputs.digest }}
      - name: Retain signed identity
        if: ${{ !(startsWith(inputs.tag, 'ui-kit-v') && matrix.package != 'ui-kit') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-provenance-${{ matrix.package }}-${{ inputs.tag }}
          path: ${{ steps.npm.outputs.bundle-path }}
          retention-days: 90
          if-no-files-found: error
