name: Verified public UI artifacts
on:
  push:
    # Plain vX.Y.Z tags select UI Kit; ui-primitives-vX.Y.Z selects Primitives.
    # Historical v0.1.3 and ui-kit-v* releases remain immutable.
    tags: ['v*', 'ui-primitives-v*']
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.14.0'
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - name: Verify tag and pack once
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            package=ui-kit
            version="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF_NAME" =~ ^ui-primitives-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            package=ui-primitives
            version="${GITHUB_REF_NAME#ui-primitives-v}"
          else
            exit 1
          fi
          test "$(jq -r '.manifest.version' "packages/$package/public-package.json")" = "$version"
          node scripts/public-ui/pack.mjs release --package "$package"
      - name: Attest exact archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/*.tgz
      - name: Publish selected release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=("${GITHUB_REF_NAME}" release/*.tgz release/*.json release/*.sha512 \
            --verify-tag --title "Public Vue UI ${GITHUB_REF_NAME}" \
            --notes "Attested compiled Vue package release. This workflow publishes GitHub assets only and does not publish to npm. Publish UI Primitives to the registry before installing a UI Kit version that depends on it. Fixture checks do not prove live sandbox integration.")
          gh release create "${release_args[@]}"
