name: Verified public UI artifacts
on:
  push:
    # Plain vX.Y.Z tags select UI Kit only. Historical v0.1.3 and
    # ui-kit-v* releases remain immutable and are never rebuilt here.
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.14.0'
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - name: Verify tag and pack once
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const tag = process.env.GITHUB_REF_NAME;
          assert.match(tag, /^v\d+\.\d+\.\d+$/);
          const config = JSON.parse(fs.readFileSync('packages/ui-kit/public-package.json', 'utf8'));
          assert.equal(tag, `v${config.manifest.version}`);
          JS
          node scripts/public-ui/pack.mjs release --package ui-kit
      - name: Attest exact archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/*.tgz
      - name: Publish selected release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=("${GITHUB_REF_NAME}" release/*.tgz release/*.json release/*.sha512 \
            --verify-tag --title "Public Vue UI ${GITHUB_REF_NAME}" \
            --notes "Attested source-SFC UI Kit release. This workflow publishes GitHub assets only and does not publish to npm. UI Primitives and the curated 0.1.3 widget release remain unchanged registry inputs for the starter. Fixture checks do not prove live sandbox integration.")
          gh release create "${release_args[@]}"
