name: Verified public UI artifacts
on:
  push:
    # New releases are selected per package. The historical v0.1.3
    # all-package release remains immutable and is never rebuilt here.
    tags: ['ui-kit-v*']
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.14.0'
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm check
      - run: pnpm audit --audit-level=high
      - name: Verify tag and pack once
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const tag = process.env.GITHUB_REF_NAME;
          assert.match(tag, /^ui-kit-v\d+\.\d+\.\d+$/);
          const config = JSON.parse(fs.readFileSync('packages/ui-kit/public-package.json', 'utf8'));
          assert.equal(tag, `ui-kit-v${config.manifest.version}`);
          JS
          node scripts/public-ui/pack.mjs release --package ui-kit
      - name: Name retained candidate
        id: candidate-artifact
        run: |
          printf 'name=torque-ui-kit-candidate-%s\n' "${GITHUB_REF_NAME#ui-kit-v}" >> "$GITHUB_OUTPUT"
      - name: Retain the packed candidate before consumer checks
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ steps.candidate-artifact.outputs.name }}
          path: |
            release/*.tgz
            release/*.json
            release/*.sha512
          if-no-files-found: error
      - name: Verify clean npm and pnpm consumers
        run: |
          for manager in npm pnpm; do
            consumer="${RUNNER_TEMP}/consumer-${manager}"
            node scripts/public-ui/create-consumer.mjs release "${consumer}" --package ui-kit
            node "${consumer}/scripts/bootstrap-ui.mjs" "${GITHUB_WORKSPACE}/release"
            (
              cd "${consumer}"
              "${manager}" install --ignore-scripts
              "${manager}" run check
              node scripts/verify-ui.mjs
              if [ "${manager}" = npm ]; then npm audit --omit=dev; else pnpm audit --prod; fi
            )
          done
      - name: Browser checks on the exact npm consumer
        run: |
          cd "${RUNNER_TEMP}/consumer-npm"
          npx playwright install chromium
          npm run demo > "${RUNNER_TEMP}/starter.log" 2>&1 &
          starter_pid=$!
          trap 'kill "${starter_pid}"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4300/api/config > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
      - name: Attest exact archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/*.tgz
      - name: Retain selected candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=("${GITHUB_REF_NAME}" release/*.tgz release/*.json release/*.sha512 \
            --verify-tag --title "Public Vue UI ${GITHUB_REF_NAME}" \
            --notes "Verified source-SFC UI Kit artifacts. This GitHub artifact is a candidate for npm publication; UI Primitives and the curated 0.1.3 widget release remain unchanged registry inputs for the starter. The starter fixture flow is verified; live sandbox access is independently required.")
          # UI Kit candidates remain drafts until the primary records the G3
          # paired-app receipt and promotes this exact retained candidate.
          gh release create "${release_args[@]}" --draft
