name: External starter checks
on:
  push:
    branches: [master, dev]
  pull_request:
permissions:
  contents: read
jobs:
  starter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/developer-starter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.14.0'
      - run: node scripts/bootstrap-ui.mjs
      - run: npm ci --ignore-scripts
      - run: npm run check && npm run check:ui && npm audit --omit=dev
      - name: Verify browser behavior
        run: |
          npx playwright install chromium
          npm run demo > "${RUNNER_TEMP}/starter.log" 2>&1 &
          starter_pid=$!
          trap 'kill "${starter_pid}"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4300/api/config > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser
